name: Cross-platform build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a Release after ALL builds and tests pass"
        type: boolean
        default: false
      release_tag:
        description: "New version tag (e.g. v0.2.0); required when publishing"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a new stable version tag, such as v0.2.0."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "This version tag already exists. Choose a new version."
            exit 1
          fi

  build:
    needs: validate
    name: ${{ matrix.platform.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        platform:
          - {name: linux-x64, os: ubuntu-24.04, plat: linux, arch: x86_64, shell: bash, exe: ""}
          - {name: windows-x64, os: windows-2025, plat: mingw, arch: x86_64, shell: "msys2 {0}", exe: ".exe"}
          - {name: macos-arm64, os: macos-15, plat: macosx, arch: arm64, shell: bash, exe: ""}
          - {name: macos-x64, os: macos-15-intel, plat: macosx, arch: x86_64, shell: bash, exe: ""}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}
    env:
      BUILD_DIR: build/${{ matrix.platform.plat }}/${{ matrix.platform.arch }}/${{ matrix.mode }}
      PACKAGE_NAME: KiCad_Forge-${{ matrix.platform.name }}-${{ matrix.mode }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Linux C++23 compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cairo

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"
          package-cache: true
          package-cache-key: ${{ matrix.platform.name }}-${{ hashFiles('xmake.lua') }}

      - name: Build the frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Generate the Windows icon
        if: runner.os == 'Windows'
        run: |
          python -m pip install cairosvg Pillow
          export CAIROCFFI_DLL_DIRECTORIES="$(cygpath -w "$MINGW_PREFIX/bin")"
          python scripts/svg2ico.py

      - name: Configure the native build
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            xmake f -y -c -p mingw -a x86_64 -m "${{ matrix.mode }}" --mingw="$(cygpath -m "$MINGW_PREFIX")"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            xmake f -y -c -p linux -a x86_64 -m "${{ matrix.mode }}" --cc=gcc-14 --cxx=g++-14 --ld=g++-14 --sh=g++-14
          else
            xmake f -y -c -p macosx -a "${{ matrix.platform.arch }}" -m "${{ matrix.mode }}"
          fi

      - name: Compile the application, tests and benchmark
        run: xmake build -y --all -j 2

      - name: Run all four unit test executables
        run: xmake test -v

      - name: Stage the portable bundle
        run: python scripts/package.py --binary "$BUILD_DIR/KiCad_Forge${{ matrix.platform.exe }}" --name "$PACKAGE_NAME"

      - name: Run the relocated bundle and test API startup and shutdown
        run: python scripts/smoke_test.py --binary "dist/$PACKAGE_NAME/KiCad_Forge${{ matrix.platform.exe }}"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.platform.name }}-${{ matrix.mode }}
          path: |
            test-results/
            build/.gens/**/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tested Release build
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the requested Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Publish all four platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # Recheck after the builds: never reuse a tag for different binaries.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "This version tag already exists. Choose a new version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
